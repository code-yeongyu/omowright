name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      # Fails on any known advisory in a production dependency (the packages a consumer installs), so the
      # next one is caught here instead of by an outside audit (#288). devDependencies are not shipped.
      - name: Dependency audit (production)
        run: bun audit --prod

      # The page-video test (test/integration.test.ts) needs ffmpeg with libvpx; without it the test skips.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor,
      # which makes Chromium's sandbox abort (SIGTRAP) at launch.
      - name: Allow unprivileged user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install chrome-headless-shell
        id: browser
        shell: bash
        run: |
          out=$(bunx @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/browsers")
          bin=$(printf '%s\n' "$out" | tail -n 1 | awk '{print $2}')
          test -x "$bin"
          "$bin" --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # One gate, as the repo defines it: the typecheck control first (it proves the compiler can
      # still reject the deliberate error), then the typecheck, lint and format check. Running the
      # three steps separately here would leave the control out of CI entirely.
      - name: Check
        shell: bash
        run: bun run check

      - name: bun test
        env:
          SHELL_BIN: ${{ steps.browser.outputs.bin }}
          CLOAKBROWSER_BIN: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: bun run test 2>&1 | tee "$RUNNER_TEMP/bun-test.log"

      # The same suite under real Node: bun is the development runner, and a package
      # Node consumers install has to keep working there (see packages' exports).
      - name: node test
        env:
          SHELL_BIN: ${{ steps.browser.outputs.bin }}
          CLOAKBROWSER_BIN: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: bun run test:node 2>&1 | tee "$RUNNER_TEMP/node-test.log"

      # The tarball a consumer actually installs, built by `prepack` and imported by its
      # package name under Node — the guard for the export map now that the branding test
      # reads the source entry.
      - name: Packed artifact (Node import)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packed/consumer"
          npm pack --pack-destination "$RUNNER_TEMP/packed"
          cd "$RUNNER_TEMP/packed/consumer"
          npm init -y >/dev/null
          npm install ../omowright-*.tgz --no-audit --no-fund >/dev/null
          # Beside the install, so `import("omowright")` resolves through its node_modules.
          cat > import-check.mjs <<'JS'
          const api = await import("omowright");
          for (const name of ["OmOPage", "OmOMouse", "OmOKeyboard"]) {
            if (api[name]?.name !== name) throw new Error(`wrong runtime class name: ${name}`);
          }
          console.log(`packed import ok: ${Object.keys(api).length} exports`);
          JS
          node import-check.mjs | tee "$RUNNER_TEMP/packed-import.log"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          count() { grep -E "$2" "$1" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+' | head -n 1; }
          {
            echo "## CI (${{ job.status }})"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | ${{ job.status }} |"
            echo "| Runner | ${{ runner.os }} |"
            echo "| Browser | ${{ steps.browser.outputs.bin }} |"
            echo "| bun test pass / fail | $(count "$RUNNER_TEMP/bun-test.log" '^ *[0-9]+ pass$') / $(count "$RUNNER_TEMP/bun-test.log" '^ *[0-9]+ fail$') |"
            # Node 22 prints TAP (`# pass`), Node 24 prints the spec reporter (`ℹ pass`); the row
            # must read it either way, or a red run looks like a row with no numbers.
            echo "| node test pass / fail | $(count "$RUNNER_TEMP/node-test.log" '^(#|ℹ) pass ') / $(count "$RUNNER_TEMP/node-test.log" '^(#|ℹ) fail ') |"
            echo "| Ref | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The browser and BrowserSkill code has win32-only paths (named pipes, scheduled tasks, profile locks) that
  # the ubuntu job skips; this job runs the same two suites on Windows so those paths have a CI owner.
  # It runs on push to main, the daily schedule, and every pull request to main (#90 is closed); a manual
  # workflow_dispatch still runs only the ubuntu job.
  # macOS has its own platform paths (the /tmp, /var and /etc root aliases in the
  # native-messaging bridge, #47/#135; the named-instance lock backend, #62) that the
  # Linux and Windows jobs cannot exercise. This job runs the platform-specific files.
  test-macos:
    name: test (macos-latest, platform)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: bun test (platform files, default TMPDIR)
        run: bun test test/bridge-transport.test.ts test/bridge-host-dir.test.ts test/instances.test.ts
      - name: bun test (platform files, TMPDIR under /tmp)
        shell: bash
        run: |
          mkdir -p /tmp/omowright-ci
          TMPDIR=/tmp/omowright-ci bun test test/bridge-transport.test.ts test/bridge-host-dir.test.ts

  test-windows:
    name: test (windows-latest)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      # The page-video test (test/integration.test.ts) needs ffmpeg with libvpx; without it the test skips.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Install chrome-headless-shell
        id: browser
        shell: bash
        run: |
          out=$(bunx @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/browsers")
          bin=$(printf '%s\n' "$out" | tail -n 1 | awk '{print $2}')
          test -x "$bin"
          "$bin" --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: bun test
        env:
          SHELL_BIN: ${{ steps.browser.outputs.bin }}
          CLOAKBROWSER_BIN: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: bun run test 2>&1 | tee "$RUNNER_TEMP/bun-test.log"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          count() { grep -E "$2" "$1" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+' | head -n 1; }
          {
            echo "## CI (${{ job.status }})"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | ${{ job.status }} |"
            echo "| Runner | ${{ runner.os }} |"
            echo "| Browser | ${{ steps.browser.outputs.bin }} |"
            echo "| bun test pass / fail | $(count "$RUNNER_TEMP/bun-test.log" '^ *[0-9]+ pass$') / $(count "$RUNNER_TEMP/bun-test.log" '^ *[0-9]+ fail$') |"
            echo "| Ref | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"
