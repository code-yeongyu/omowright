name: Lint Workflows

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/install-actionlint.sh"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/install-actionlint.sh"

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + summary rule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint (installation failure means lint did not run)
        id: install_actionlint
        run: bash scripts/install-actionlint.sh

      - name: Run actionlint
        id: actionlint
        run: ./actionlint -color -shellcheck=""

      - name: Enforce mandatory workflow summary
        shell: bash
        run: |
          fail=0
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            if ! grep -q 'GITHUB_STEP_SUMMARY' "$f"; then
              echo "::error file=$f::workflow writes no \$GITHUB_STEP_SUMMARY (a job summary is mandatory)"
              fail=1
            fi
          done
          exit "$fail"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Lint Workflows — ${{ job.status }}"
            echo
            if [ "${{ steps.install_actionlint.outcome }}" != "success" ]; then
              echo "actionlint installation failed; lint did not run."
            else
              echo "actionlint result: ${{ steps.actionlint.outcome }}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
