<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Small toast</title>
  <style>
    html, body { margin: 0; height: 100%; }
    main { padding: 24px; font-family: sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Page with a tiny toast and enough text for the readiness probe</h1>
    <p>The toast sits in the corner and must not count as a blocking overlay.</p>
  </main>
  <div id="toast" style="position:fixed;right:8px;bottom:8px;width:80px;height:24px;background:#222;color:#fff;z-index:9999;font-size:12px;line-height:24px;text-align:center">Saved</div>
</body>
</html>
