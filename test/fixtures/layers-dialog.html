<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cookie wall</title>
  <style>
    html, body { margin: 0; height: 100%; }
    main { padding: 24px; font-family: sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Article with enough text for the readiness probe</h1>
    <p>Underlying page content that should be covered by the cookie dialog.</p>
  </main>
  <div role="dialog" aria-label="Cookie consent" style="position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:9999;color:#fff;display:flex;align-items:center;justify-content:center">
    <p>We use cookies to improve the experience.</p>
    <button>Accept</button>
  </div>
</body>
</html>
